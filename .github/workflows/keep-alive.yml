name: Keep API warm

# Render's free tier spins the API down after ~15 minutes idle, and the next
# request then has to cold-start the container (30-60s). Pinging on a
# schedule shorter than that window keeps it warm so real users don't hit
# the cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 10 --retry-max-time 300 --max-time 120 https://airbnc-api.onrender.com/test
